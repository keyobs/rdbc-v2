name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref (branch or tag) to test"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch or tag) to run on"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: 🔑 Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.KEYOBS_PACKAGES_TOKEN }}" >> .npmrc

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      # Uncomment when Vitest is installed (J2)
      # - name: 🧪 Run tests
      #   run: yarn test:run

      - name: ✅ Tests complete
        run: echo "✅ Tests complete."
