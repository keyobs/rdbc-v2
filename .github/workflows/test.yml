name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref (branch or tag) to test"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch or tag) to run on"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: ⚙️ Enable Yarn Modern
        run: |
          npm install --global corepack@latest
          corepack enable yarn

      - name: 📂 Locate Yarn cache
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: 📦 Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: ${{ runner.os }}-node26-yarn4-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node26-yarn4-

      - name: 📦 Install dependencies
        run: yarn install --immutable
        env:
          KEYOBS_PACKAGES_TOKEN: ${{ secrets.KEYOBS_PACKAGES_TOKEN }}

      - name: 🔍 Lint (Biome)
        run: yarn lint

      - name: 🔄 Generate Astro types
        run: yarn astro sync

      - name: 🔎 Typecheck
        run: yarn run check

      # Uncomment when Vitest is installed (J2)
      # - name: 🧪 Run tests
      #   run: yarn test:run

      - name: ✅ Tests complete
        run: echo "✅ Tests complete."
