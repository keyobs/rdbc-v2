name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref (branch or tag) to build"
        required: false
        type: string
        default: ""
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch or tag) to build"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-name.outputs.name }}
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@keyobs"

      - name: 📦 Install dependencies
        run: pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.KEYOBS_PACKAGES_TOKEN }}

      - name: 🔍 Lint (Biome)
        run: pnpm lint

      - name: 🔄 Generate Astro types
        run: pnpm exec astro sync

      - name: 🔎 Typecheck
        run: pnpm check

      - name: 🏗️ Build
        run: pnpm build

      - name: 🏷️ Set artifact name
        id: set-name
        run: echo "name=dist-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-name.outputs.name }}
          path: dist/

      - name: ✅ Build complete
        run: echo "✅ Build successful."
