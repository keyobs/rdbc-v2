name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref (branch or tag) to build"
        required: false
        type: string
        default: ""
      base_path:
        description: "Astro base path (e.g. /rdbc-v2 for GitHub Pages, / for OVH)"
        required: false
        type: string
        default: "/"
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch or tag) to build"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ASTRO_BASE_PATH: ${{ inputs.base_path }}
    outputs:
      artifact-name: ${{ steps.set-name.outputs.name }}
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: 🔑 Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.KEYOBS_PACKAGES_TOKEN }}" >> .npmrc

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔄 Generate Astro types
        run: yarn astro sync

      - name: 🏗️ Build
        run: yarn build

      - name: 🏷️ Set artifact name
        id: set-name
        run: echo "name=dist-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-name.outputs.name }}
          path: dist/

      - name: ✅ Build complete
        run: echo "✅ Build successful."
