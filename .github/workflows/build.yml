name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref (branch or tag) to build"
        required: false
        type: string
        default: ""
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch or tag) to build"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-name.outputs.name }}
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint (Biome)
        run: npm run lint

      - name: 🔄 Generate Astro types
        run: npx astro sync

      - name: 🔎 Typecheck
        run: npm run check

      - name: 🏗️ Build
        run: npm run build

      - name: 🏷️ Set artifact name
        id: set-name
        run: echo "name=dist-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-name.outputs.name }}
          path: dist/

      - name: ✅ Build complete
        run: echo "✅ Build successful."
