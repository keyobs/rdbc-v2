name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref (branch or tag) to build"
        required: false
        type: string
        default: ""
      base_path:
        description: "Astro base path (e.g. /rdbc-v2 for GitHub Pages, / for OVH)"
        required: false
        type: string
        default: "/"
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch or tag) to build"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_BASE_PATH: ${{ inputs.base_path }}
    outputs:
      artifact-name: ${{ steps.set-name.outputs.name }}
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: ⚙️ Enable Yarn Modern
        run: |
          npm install --global corepack@latest
          corepack enable yarn

      - name: 📂 Locate Yarn cache
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: 📦 Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: ${{ runner.os }}-node26-yarn4-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node26-yarn4-

      - name: 📦 Install dependencies
        run: yarn install --immutable
        env:
          KEYOBS_PACKAGES_TOKEN: ${{ secrets.KEYOBS_PACKAGES_TOKEN }}

      - name: 🔄 Generate Astro types
        run: yarn astro sync

      - name: 🏗️ Build
        run: yarn build

      - name: 🏷️ Set artifact name
        id: set-name
        run: echo "name=dist-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.set-name.outputs.name }}
          path: dist/

      - name: ✅ Build complete
        run: echo "✅ Build successful."
